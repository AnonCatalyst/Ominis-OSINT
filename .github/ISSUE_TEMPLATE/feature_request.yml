name: Feature request
description: Suggest an engine, format, flag or workflow improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ominis is deliberately small and proxy-optional. Features that add a
        mandatory account, a paid service as a hard requirement, or that turn
        proxies on by default are unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does it hurt today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Ominis do instead? Include flags and defaults.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing flags, external tools, or a smaller change.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search engines
        - Username search
        - Proxies
        - Output formats
        - Packaging / install
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This works without a paid key by default.
          required: true
        - label: I searched existing issues and discussions.
          required: true
